name: Deploy static site to S3

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject visitor counter API URL
        env:
          VISITOR_COUNTER_API_URL: ${{ secrets.VISITOR_COUNTER_API_URL }}
        run: |
          if [ -n "$VISITOR_COUNTER_API_URL" ]; then
            python -c "from pathlib import Path; import os, re; index_file = Path('index.html'); html = index_file.read_text(encoding='utf-8'); pattern = r'<meta\\s+name=\"visitor-counter-api\"\\s+content=\"[^\"]*\"\\s*/>'; replacement = f'<meta name=\"visitor-counter-api\" content=\"{os.environ[\"VISITOR_COUNTER_API_URL\"]}\" />'; updated_html, count = re.subn(pattern, replacement, html, count=1); if count == 0: raise SystemExit('visitor-counter meta tag not found in index.html'); index_file.write_text(updated_html, encoding='utf-8')"
            fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync site to S3
        run: |
          aws s3 sync . s3://$S3_BUCKET --delete --exclude ".git/*" --exclude ".github/*" --exclude "backend/*" --exclude "*.md"
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}

      - name: Create CloudFront invalidation
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
          fi
