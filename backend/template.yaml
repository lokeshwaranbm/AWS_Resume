AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Visitor counter backend for the resume site

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 128
    Architectures:
      - x86_64

Resources:
  VisitorCounterTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: counterId
          AttributeType: S
      KeySchema:
        - AttributeName: counterId
          KeyType: HASH
      TableName: visitor-counter

  VisitorCounterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.handler
      Environment:
        Variables:
          COUNTER_TABLE_NAME: !Ref VisitorCounterTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VisitorCounterTable
      Events:
        CounterApi:
          Type: HttpApi
          Properties:
            Path: /counter
            Method: ANY
    Metadata:
      BuildMethod: nodejs20.x

Outputs:
  VisitorCounterApiUrl:
    Description: HTTP API endpoint for the visitor counter
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/counter'
  VisitorCounterTableName:
    Description: DynamoDB table name used by the visitor counter
    Value: !Ref VisitorCounterTable
